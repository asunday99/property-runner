<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>재개발 러너 (RUNNER)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=10d2911cc3c5bedf397ff5b602bd52dd&libraries=services"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Pretendard', sans-serif; user-select: none; background-color: #f3f4f6; }
        #app-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        
        #header { background: white; padding: 15px 30px; border-bottom: 2px solid #e5e7eb; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; z-index: 50; }
        
        .tab-btn { padding: 10px 24px; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; transition: all 0.2s; border: 2px solid transparent; }
        .tab-active { background-color: #2563eb; color: white; border-color: #1d4ed8; box-shadow: 0 4px 6px rgba(37,99,235,0.2); }
        .tab-inactive { background-color: #e5e7eb; color: #4b5563; hover:background-color: #d1d5db; }

        #view-marathon, #view-map { flex-grow: 1; position: relative; width: 100%; height: 100%; }
        #view-map { display: none; }
        
        #view-marathon { background: linear-gradient(to bottom, #d1d5db 0%, #9ca3af 100%); overflow: hidden; }
        .track-lines { position: absolute; top: 15%; bottom: 15%; left: 0; right: 0; border-top: 3px dashed rgba(255,255,255,0.4); border-bottom: 3px dashed rgba(255,255,255,0.4); pointer-events: none; }
        
        .timeline-container { position: absolute; left: 0; right: 10%; top: 0; bottom: 0; pointer-events: none; z-index: 5; }
        .time-marker { position: absolute; top: 0; bottom: 0; border-left: 2px dashed rgba(255,255,255,0.7); display: flex; flex-direction: column; justify-content: flex-start; padding-left: 8px; padding-top: 15px; }
        .time-marker span { font-size: 18px; font-weight: 900; color: #1e3a8a; text-shadow: 2px 2px 0px rgba(255,255,255,0.8), -2px -2px 0px rgba(255,255,255,0.8), 2px -2px 0px rgba(255,255,255,0.8), -2px 2px 0px rgba(255,255,255,0.8); opacity: 0.9; }

        .finish-line { position: absolute; right: 10%; top: 0; bottom: 0; width: 25px; background: repeating-linear-gradient(45deg, white, white 15px, #ef4444 15px, #ef4444 30px); box-shadow: -10px 0 20px rgba(0,0,0,0.15); z-index: 10; }
        .finish-banner { position: absolute; right: calc(10% - 60px); top: 20px; background: #2563eb; color: white; padding: 8px 16px; border-radius: 6px; font-weight: 900; font-size: 20px; z-index: 11; letter-spacing: 2px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); text-align: center; }

        .runner-container { position: absolute; display: flex; justify-content: center; align-items: flex-end; }
        .runner-container.active { z-index: 9999 !important; }

        .character { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; filter: drop-shadow(0 5px 5px rgba(0,0,0,0.4)); }

        .head { width: 36px; height: 36px; border-radius: 50%; background-color: #fce7f3; border: 3px solid white; box-shadow: 0 4px 6px rgba(0,0,0,0.2); z-index: 10; display: flex; justify-content: center; align-items: center; font-size: 20px; font-weight: 900; color: #1f2937; overflow: hidden; position: relative; transition: transform 0.2s; margin-bottom: -10px; }
        .head:hover { transform: scale(1.25); border-color: #2563eb; }
        .head.sad { background-color: #fecaca; }
        .head .emoji { pointer-events: none; }
        .head img { width: 100%; height: 100%; object-fit: cover; display: none; pointer-events: none; }

        .theme-red.vest { background: linear-gradient(135deg, #f87171, #dc2626); }
        .theme-blue.vest { background: linear-gradient(135deg, #60a5fa, #2563eb); }
        .theme-red.bldg { background: linear-gradient(to bottom, #f87171, #991b1b); border-bottom: 6px solid #7f1d1d; }
        .theme-blue.bldg { background: linear-gradient(to bottom, #94a3b8, #475569); border-bottom: 6px solid #334155; }
        .theme-red.ground { background: linear-gradient(to bottom, #fca5a5, #dc2626); box-shadow: inset 0 3px 0 rgba(255,255,255,0.5), 0 6px 0 #7f1d1d, 0 10px 5px rgba(0,0,0,0.3); }
        .theme-blue.ground { background: linear-gradient(to bottom, #4ade80, #16a34a); box-shadow: inset 0 3px 0 rgba(255,255,255,0.5), 0 6px 0 #a16207, 0 10px 5px rgba(0,0,0,0.3); color: white !important; }

        .vest { width: 48px; height: 32px; border-radius: 10px; display: flex; justify-content: center; align-items: center; color: white; font-weight: 900; font-size: 12px; z-index: 5; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.2), 0 4px 4px rgba(0,0,0,0.2); }
        .legs { display: flex; gap: 10px; margin-top: -6px; z-index: 1; }
        .leg { width: 8px; height: 18px; background: linear-gradient(to bottom, #4b5563, #111827); border-radius: 4px; transform-origin: top center; box-shadow: 0 2px 2px rgba(0,0,0,0.3); animation-play-state: paused; }
        
        .bldg { width: 54px; height: 56px; border-radius: 6px 6px 2px 2px; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; color: white; font-weight: 900; font-size: 11px; z-index: 5; padding-bottom: 6px; box-shadow: inset 0 2px 0 rgba(255,255,255,0.4), inset -4px 0 0 rgba(0,0,0,0.1), 0 5px 5px rgba(0,0,0,0.3); line-height: 1.3; }
        .bldg .icon { font-size: 20px; margin-bottom: 2px; text-shadow: 0 2px 2px rgba(0,0,0,0.3); }
        .ground { width: 60px; height: 32px; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: white; font-weight: 900; font-size: 12px; z-index: 5; margin-top: 5px; }

        .running .left-leg { animation: run-leg var(--run-speed) infinite linear; animation-play-state: running; }
        .running .right-leg { animation: run-leg var(--run-speed) infinite linear; animation-delay: calc(var(--run-speed) / -2); animation-play-state: running; }
        @keyframes run-leg { 0% { transform: rotate(-25deg); } 50% { transform: rotate(25deg); } 100% { transform: rotate(-25deg); } }
        .running-bounce { animation: bob var(--run-speed) infinite ease-in-out; }
        @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }

        .speech-bubble { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); background-color: white; color: #111827; border: 2px solid #e5e7eb; padding: 10px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; white-space: nowrap; display: none; z-index: 30; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); pointer-events: none; margin-bottom: 5px; }
        .speech-bubble::after { content: ''; position: absolute; top: 100%; left: 50%; margin-left: -6px; border-width: 6px; border-style: solid; border-color: white transparent transparent transparent; }
        .runner-container.active .speech-bubble { display: block; animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: translateX(-50%) scale(0.8); opacity: 0; } 100% { transform: translateX(-50%) scale(1); opacity: 1; } }

        #loading { position: absolute; inset: 0; background: rgba(255,255,255,0.8); display: flex; justify-content: center; align-items: center; z-index: 100; font-size: 24px; font-weight: bold; color: #3b82f6; flex-direction: column; }
    </style>
</head>
<body>
    <div id="app-container">
        <div id="header">
            <div>
                <h1 class="text-3xl font-extrabold text-blue-700">🏃‍♂️ 재개발 러너 (RUNNER)</h1>
                <p class="text-sm text-gray-500 mt-2 font-medium">
                    <span class="inline-block w-3 h-3 bg-blue-500 rounded-sm mr-1"></span>법인/개인 (파란) &nbsp;|&nbsp; 
                    <span class="inline-block w-3 h-3 bg-red-500 rounded-sm mr-1"></span>순수 위탁 (빨간) &nbsp;|&nbsp; 
                    💡 얼굴 클릭 시 사진 영구 등록
                </p>
            </div>
            
            <div class="flex gap-3">
                <button id="btn-marathon" class="tab-btn tab-active" onclick="switchTab('marathon')">🏃‍♂️ 마라톤 뷰</button>
                <button id="btn-map" class="tab-btn tab-inactive" onclick="switchTab('map')">🗺️ 지도 뷰</button>
            </div>
        </div>
        
        <input type="file" id="photoInput" accept="image/*" style="display: none;">
        <div id="loading">구글 시트 데이터 불러오는 중... 🏃‍♂️💨</div>

        <div id="view-marathon">
            <div class="timeline-container">
                <div class="time-marker" style="left: 0%;"><span>START</span></div>
                <div class="time-marker" style="left: 25%;"><span>초기(25%)</span></div>
                <div class="time-marker" style="left: 50%;"><span>중반(50%)</span></div>
                <div class="time-marker" style="left: 75%;"><span>후반(75%)</span></div>
            </div>
            <div class="track-lines"></div>
            <div class="finish-line"></div>
            <div class="finish-banner">FINISH<br>(100%)</div>
            <div id="runners-area"></div>
        </div>

        <div id="view-map"></div>
    </div>

    <script>
        const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQUFrd48p3c6nFJA7rYjoeK43cMqrGTNT_Tv2W0QizuPnrUufbbuKfPN1VCZwtsfpmuljur_TOLtk8i/pub?gid=2053604895&single=true&output=csv';
        
        let runnersData = [];
        let mapInitialized = false;
        let kakaoMap = null;
        let geocoder = null;

        const photoInput = document.getElementById('photoInput');
        let currentHeadElement = null;
        let currentEmojiElement = null;
        let currentAssetId = null;

        function switchTab(mode) {
            document.getElementById('view-marathon').style.display = (mode === 'marathon') ? 'block' : 'none';
            document.getElementById('view-map').style.display = (mode === 'map') ? 'block' : 'none';
            
            const btnMarathon = document.getElementById('btn-marathon');
            const btnMap = document.getElementById('btn-map');
            
            if (mode === 'marathon') {
                btnMarathon.className = 'tab-btn tab-active';
                btnMap.className = 'tab-btn tab-inactive';
            } else {
                btnMap.className = 'tab-btn tab-active';
                btnMarathon.className = 'tab-btn tab-inactive';
                if (!mapInitialized) {
                    initKakaoMap();
                    mapInitialized = true;
                }
            }
        }

        // 사진 첨부 시 브라우저 Local Storage에 Base64로 영구 저장
        photoInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0] && currentAssetId) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const base64Str = event.target.result;
                    currentHeadElement.src = base64Str;
                    currentHeadElement.style.display = 'block';
                    currentEmojiElement.style.display = 'none';
                    localStorage.setItem('photo_' + currentAssetId, base64Str);
                };
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        async function fetchAndParseData() {
            Papa.parse(CSV_URL, {
                download: true,
                header: false,
                complete: function(results) { processData(results.data); }
            });
        }

        function processData(data) {
            let headerRowIndex = data.findIndex(row => row[0] && row[0].includes('자산ID'));
            if (headerRowIndex === -1) return;

            const headers = data[headerRowIndex];
            const getCol = (name) => headers.findIndex(h => h && h.replace(/\s+/g, '') === name.replace(/\s+/g, ''));
            
            const idxId = getCol('자산ID');
            const idxManager = getCol('관리주체');
            const idxOwner = getCol('소유주');
            const idxType = getCol('유형'); 
            const idxState = getCol('상태'); 
            const idxDate = getCol('취득일'); 
            const idxMethod = getCol('사업방식');
            const idxProgress = getCol('개발진행단계');
            const idxSpeech = headers.findIndex(h => h && (h.includes('말풍선') || h.includes('대사')));
            const idxAddress = getCol('주소'); 

            const dataRows = data.filter(row => row[idxId] && row[idxId].startsWith('Re_'));

            const methodData = {
                '민간도심복합개발': { years: [1, 2, 3, 4, 5, 6, 8, 8.5], max: 8.5 },
                '모아타운': { years: [1, 1.5, 2.5, 3.5, 4.5, 5.5, 8, 9], max: 9 },
                '역세권시프트': { years: [1, 2, 3, 4.5, 6, 7.5, 9, 12], max: 12 },
                '재건축': { years: [1, 2.5, 4, 5.5, 7, 8, 9.5, 13], max: 13 },
                '재개발': { years: [1, 3, 5, 7, 9, 11, 14, 15], max: 15 },
                'default': { years: [1, 2, 3, 5, 7, 9, 11, 14], max: 15 }
            };

            runnersData = dataRows.map(row => {
                const manager = row[idxManager] || '';
                let owner = row[idxOwner] ? row[idxOwner].split('(')[0].trim() : '익명';
                const typeStr = idxType >= 0 ? (row[idxType] || '').trim() : '';
                const state = row[idxState] || '';
                const method = idxMethod >= 0 ? (row[idxMethod] || '').trim() : '';
                const progressStr = idxProgress >= 0 ? (row[idxProgress] || '') : '';
                const dateStr = idxDate >= 0 ? (row[idxDate] || '') : '';
                const customSpeech = idxSpeech >= 0 ? row[idxSpeech] : '';
                const address = idxAddress >= 0 ? row[idxAddress] : '';

                let markerType = 'runner';
                if (method.toLowerCase() === 'x' || method === '' || progressStr === '해당없음' || progressStr.includes('취소')) {
                    if (typeStr.includes('토지')) markerType = 'land';
                    else markerType = 'building'; 
                }

                let progressYear = 0;
                let maxYear = 15;
                const m = method.replace(/\s+/g, '');
                const mData = methodData[m] || methodData['default'];
                maxYear = mData.max;

                const stageMatch = progressStr.match(/^(\d+)/);
                const stageNum = stageMatch ? parseInt(stageMatch[1], 10) : -1;

                if (state.includes('매각완료')) {
                    progressYear = maxYear;
                } else if (markerType !== 'runner') {
                    progressYear = 0;
                } else {
                    progressYear = (stageNum >= 0 && stageNum < mData.years.length) ? mData.years[stageNum] : 0;
                }

                let completionPercent = (progressYear / maxYear);
                let progressScore = Math.min(90, completionPercent * 90);

                let acqYear = 2026; let acqMonth = 9;
                if (dateStr) {
                    const parts = dateStr.split('.');
                    acqYear = parseInt(parts[0]) || 2026; acqMonth = parseInt(parts[1]) || 1;
                }
                const monthsHeld = Math.max(1, (2026 - acqYear) * 12 + (9 - acqMonth));
                
                let speed = 50, status = 'normal';
                
                if (markerType !== 'runner') {
                    speed = 0; status = 'normal'; 
                } else if (state.includes('매각완료')) {
                    speed = 0; status = 'finished';
                } else {
                    const actualYears = monthsHeld / 12;
                    const efficiency = progressYear / (actualYears || 1); 
                    speed = Math.max(15, Math.min(100, efficiency * 25)); 
                    if (efficiency >= 1.5) status = 'good';
                    else if (efficiency < 0.3 && actualYears > 3) status = 'bad'; 
                }

                let msg = customSpeech.trim();
                if (!msg) {
                    if (status === 'finished') msg = `[${method}] 나 먼저 간다~ 🏆 (매각완료)`;
                    else if (markerType !== 'runner') msg = `[${typeStr}] 묵묵히 운용 중 💼`;
                    else if (status === 'bad') msg = `산 지 ${Math.floor(monthsHeld/12)}년인데 😭 (${progressStr})`;
                    else {
                        let shortStage = progressStr.split('/')[0].trim();
                        msg = `[${method}] ${shortStage} (${progressYear}년차/총${maxYear}년) 🏃`;
                    }
                }

                return { id: row[idxId], owner, manager, typeStr, markerType, status, speed, msg, progressScore, address };
            });

            document.getElementById('loading').style.display = 'none';
            renderMarathon();
        }

        function createCharacterDOM(data, isMapMode = false) {
            const container = document.createElement('div');
            container.className = 'runner-container';
            
            const runSpeedDuration = 1.6 - (data.speed / 100) * 1.4;
            container.style.setProperty('--run-speed', `${runSpeedDuration}s`);

            const character = document.createElement('div');
            character.className = 'character';
            
            if (!isMapMode && data.markerType === 'runner' && data.status !== 'finished' && data.speed > 0) {
                character.classList.add('running', 'running-bounce');
            }

            const head = document.createElement('div');
            head.className = `head ${data.status === 'bad' ? 'sad' : ''}`;
            
            // 이름별 이모지 설정 (고미=G, 뉴푸드=N)
            let faceText = '😎';
            if (data.owner.includes('뉴푸드')) faceText = 'N';
            else if (data.owner.includes('고미')) faceText = 'G';
            else if (data.status === 'finished') faceText = '🏆';
            else if (data.status === 'good') faceText = '😃';
            else if (data.status === 'bad') faceText = '😭';
            else if (data.markerType === 'land') faceText = '👨';
            else if (data.markerType === 'building') faceText = '👩';

            const emojiSpan = document.createElement('span');
            emojiSpan.className = 'emoji'; 
            emojiSpan.textContent = faceText;
            
            const uploadedImg = document.createElement('img');
            
            // LocalStorage에서 저장된 사진 불러오기
            const savedPhoto = localStorage.getItem('photo_' + data.id);
            if (savedPhoto) {
                uploadedImg.src = savedPhoto;
                uploadedImg.style.display = 'block';
                emojiSpan.style.display = 'none';
            }

            head.appendChild(emojiSpan); head.appendChild(uploadedImg);

            head.addEventListener('click', (e) => {
                e.stopPropagation();
                currentHeadElement = uploadedImg;
                currentEmojiElement = emojiSpan;
                currentAssetId = data.id; // 현재 수정 중인 자산 ID 추적
                photoInput.click();
            });

            const ownerName = data.owner; 
            const themeClass = data.manager === '위탁' ? 'theme-red' : 'theme-blue';

            character.appendChild(head);

            if (data.markerType === 'runner') {
                const vest = document.createElement('div');
                vest.className = `vest ${themeClass}`;
                vest.textContent = ownerName;
                
                const legs = document.createElement('div');
                legs.className = 'legs';
                legs.innerHTML = `<div class="leg left-leg"></div><div class="leg right-leg"></div>`;
                
                character.appendChild(vest); character.appendChild(legs);
            } 
            else if (data.markerType === 'building') {
                const bldg = document.createElement('div');
                bldg.className = `bldg ${themeClass}`;
                bldg.innerHTML = `<div class="icon">🏢</div><div>${ownerName}</div>`;
                character.appendChild(bldg);
            } 
            else if (data.markerType === 'land') {
                const ground = document.createElement('div');
                ground.className = `ground ${themeClass}`;
                ground.textContent = ownerName;
                character.appendChild(ground);
            }

            const speech = document.createElement('div');
            speech.className = 'speech-bubble';
            speech.textContent = data.msg;
            container.appendChild(speech);

            character.addEventListener('click', (e) => {
                if(e.target.closest('.head')) return;
                document.querySelectorAll('.runner-container').forEach(c => c.classList.remove('active'));
                container.classList.add('active');
            });

            container.appendChild(character);
            return container;
        }

        function renderMarathon() {
            const trackArea = document.getElementById('runners-area');
            const trackHeight = document.getElementById('view-marathon').clientHeight;
            
            runnersData.filter(d => d.markerType === 'runner').forEach((data) => {
                const charDOM = createCharacterDOM(data, false);
                const topPos = Math.random() * (trackHeight * 0.7) + (trackHeight * 0.15);
                charDOM.style.top = `${topPos}px`;
                charDOM.style.zIndex = Math.floor(topPos);
                
                let finalLeft = data.progressScore + (Math.random() * 2 - 1);
                if (data.status === 'finished') finalLeft = 90 + Math.random() * 2;
                charDOM.style.left = `${finalLeft}%`;
                
                trackArea.appendChild(charDOM);
            });
        }

        function initKakaoMap() {
            if (typeof kakao === 'undefined' || !kakao.maps) return;

            const mapContainer = document.getElementById('view-map');
            const mapOption = { center: new kakao.maps.LatLng(37.5255, 126.9954), level: 7 };
            kakaoMap = new kakao.maps.Map(mapContainer, mapOption);
            geocoder = new kakao.maps.services.Geocoder();

            function cleanAddress(addr) {
                let clean = addr.split(',')[0].split('.')[0].trim();
                clean = clean.replace(/외\s*\d+필지/g, '').replace(/제상가동.*/g, '').replace(/번지.*/g, '');
                return clean.trim();
            }

            const addressGroups = {};
            runnersData.forEach(data => {
                if (!data.address || data.address.includes('인천')) return; 
                const searchAddr = cleanAddress(data.address);
                if (!addressGroups[searchAddr]) addressGroups[searchAddr] = [];
                addressGroups[searchAddr].push(data);
            });

            Object.keys(addressGroups).forEach(addr => {
                geocoder.addressSearch(addr, function(result, status) {
                    if (status === kakao.maps.services.Status.OK) {
                        const coords = new kakao.maps.LatLng(result[0].y, result[0].x);
                        const group = addressGroups[addr];
                        const count = group.length;

                        group.forEach((runnerData, index) => {
                            const charDOM = createCharacterDOM(runnerData, true);
                            const offsetX = (index - (count - 1) / 2) * 55;
                            
                            const overlayWrap = document.createElement('div');
                            overlayWrap.style.transform = `translateX(${offsetX}px)`;
                            charDOM.style.position = 'relative';
                            charDOM.style.left = '0'; 
                            charDOM.style.top = '0';

                            overlayWrap.appendChild(charDOM);

                            new kakao.maps.CustomOverlay({
                                map: kakaoMap,
                                position: coords,
                                content: overlayWrap,
                                yAnchor: 1 
                            });
                        });
                    }
                });
            });
        }

        document.body.addEventListener('click', (e) => {
            if (!e.target.closest('.runner-container') && !e.target.closest('.tab-btn')) {
                document.querySelectorAll('.runner-container').forEach(c => c.classList.remove('active'));
            }
        });

        window.addEventListener('DOMContentLoaded', fetchAndParseData);
    </script>
</body>
</html>
